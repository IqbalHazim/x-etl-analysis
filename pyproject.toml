[project]
name = "xetl"
version = "0.1.0"
description = "ETL and rule-based sentiment/legitimacy analysis of #RohingyaMalaysia posts on X"
readme = "README.md"
authors = [
    { name = "IqbalHzm", email = "iqbal@defidive.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lingua-language-detector>=2.2.0",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "twscrape>=0.20.1",
    "typer>=0.27.3",
    "wordcloud>=1.9.6",
]

[project.scripts]
xetl = "xetl.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]